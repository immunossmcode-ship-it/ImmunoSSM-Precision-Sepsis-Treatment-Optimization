[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immunossm-research"
version = "0.1.0"
description = "Configurable research implementation modules for ImmunoSSM"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "statsmodels",
  "pyyaml",
  "networkx",
  "tqdm"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
